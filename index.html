<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Carlos Maldonado &mdash; Maldonado Heating &amp; Cooling</title>
    <meta name="description" content="Carlos Maldonado, Maldonado Heating &amp; Cooling. Heating, Cooling, Installation &amp; Repair - Kansas City Metro.">

    <!-- PWA / Home Screen support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="My Card">
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1A1A1A">
    <link rel="apple-touch-icon" href="logo.jpg">
    <link rel="icon" href="logo.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            /* Brand colors live on the button + the QR only. The card stays clean. */
            --heat: #FF6A28;
            --heat-rgb: 255, 106, 40;
            --cool: #3B9EFF;
            --cool-rgb: 59, 158, 255;
            --split: linear-gradient(100deg, var(--heat) 0%, #9E6FB4 52%, var(--cool) 100%);

            --bg: #1A1A1A;
            --text-primary: #FFFFFF;
            --text-secondary: #C7CCD4;
            --text-muted: #808285;
            --hairline: rgba(255, 255, 255, 0.10);
        }

        body {
            font-family: 'Montserrat', Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            max-width: 420px;
            width: 100%;
            background: linear-gradient(180deg, #232323 0%, var(--bg) 100%);
            border: 1px solid var(--hairline);
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        /* One restrained brand cue on the top edge */
        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 50%;
            transform: translateX(-50%);
            width: 58%;
            height: 2px;
            background: var(--split);
            border-radius: 2px;
        }

        .logo {
            width: 140px;
            height: 140px;
            margin: 0 auto 22px;
            border-radius: 14px;
            overflow: hidden;
        }

        .logo img { width: 100%; height: 100%; object-fit: contain; }

        .name {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 21px;
            color: var(--text-primary);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .company {
            font-weight: 500;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        /* Hairline rule with a small brand diamond at center */
        .divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin: 0 auto 18px;
            width: 190px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--hairline);
        }
        .flake {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            filter: drop-shadow(0 0 6px rgba(59, 158, 255, 0.35));
        }

        .tagline {
            font-family: 'Orbitron', sans-serif;
            font-weight: 500;
            font-size: 12px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--text-primary);
            margin-bottom: 14px;
        }

        .bio {
            font-size: 13.5px;
            line-height: 1.65;
            color: var(--text-secondary);
            font-weight: 300;
            margin-bottom: 26px;
            padding: 0 6px;
        }

        .bio .area { color: var(--text-muted); font-size: 12.5px; }

        .contact-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 22px;
        }

        /* Neutral rows - clean, no per-row color */
        .contact-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--hairline);
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 400;
            transition: all 0.2s ease;
        }

        .contact-link:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 255, 255, 0.22);
        }

        .contact-link svg { width: 18px; height: 18px; flex-shrink: 0; fill: var(--text-secondary); }
        .contact-link span { color: var(--text-secondary); }

        .social { display: flex; justify-content: center; gap: 12px; margin-bottom: 24px; }

        .social a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--hairline);
            transition: all 0.2s ease;
        }

        .social a:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-2px); }
        .social svg { width: 21px; height: 21px; fill: var(--text-secondary); }
        .social a:hover svg { fill: var(--text-primary); }

        /* SINGLE action: show the QR. No direct .vcf link - standing card standard. */
        .save-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            border: none;
            border-radius: 10px;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            background: var(--split);
            color: #FFFFFF;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            transition: all 0.2s ease;
            margin-bottom: 22px;
        }

        .save-btn:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(var(--heat-rgb), 0.20), 0 6px 24px rgba(var(--cool-rgb), 0.20);
        }

        .save-btn:active { transform: translateY(0); }
        .save-btn svg { width: 19px; height: 19px; fill: #FFFFFF; }

        .qr-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .qr-overlay.active { display: flex; }

        .qr-modal {
            background: #202020;
            border: 1px solid var(--hairline);
            border-radius: 18px;
            padding: 28px;
            text-align: center;
            max-width: 340px;
            width: 100%;
        }

        .qr-modal h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 6px;
            color: var(--text-primary);
        }

        .qr-modal p { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }

        .qr-frame {
            background: #FFFFFF;
            border-radius: 14px;
            padding: 10px;
            margin: 0 auto 18px;
            width: 250px;
        }
        .qr-frame img { width: 100%; height: auto; display: block; }

        .qr-close {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: var(--text-secondary);
            padding: 10px 26px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .qr-close:hover { border-color: rgba(255, 255, 255, 0.4); color: var(--text-primary); }

        .footer { font-size: 11px; color: var(--text-muted); }
        .footer a { color: var(--text-secondary); text-decoration: none; }

        @media (max-width: 480px) {
            .card { padding: 32px 24px; }
            .name { font-size: 18px; letter-spacing: 1px; }
            .tagline { font-size: 11px; letter-spacing: 2px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="logo.jpg" alt="Maldonado Heating &amp; Cooling">
        </div>

        <div class="name">Carlos Maldonado</div>
        <div class="company">Maldonado Heating &amp; Cooling</div>

        <div class="divider">
            <svg class="flake" viewBox="0 0 24 24" aria-hidden="true">
                <defs>
                    <linearGradient id="flakeGrad" x1="0" y1="1" x2="1" y2="0">
                        <stop offset="0%" stop-color="#FF6A28"/>
                        <stop offset="55%" stop-color="#9E6FB4"/>
                        <stop offset="100%" stop-color="#3B9EFF"/>
                    </linearGradient>
                </defs>
                <path fill="url(#flakeGrad)" d="M22 11h-4.17l3.24-3.24-1.41-1.42L15 11h-2V9l4.66-4.66-1.42-1.41L13 6.17V2h-2v4.17L7.76 2.93 6.34 4.34 11 9v2H9L4.34 6.34 2.93 7.76 6.17 11H2v2h4.17l-3.24 3.24 1.41 1.42L9 13h2v2l-4.66 4.66 1.42 1.41L11 17.83V22h2v-4.17l3.24 3.24 1.42-1.41L13 15v-2h2l4.66 4.66 1.41-1.42L16.83 13H22z"/>
            </svg>
        </div>

        <div class="tagline">Two Seasons. One Standard.</div>

        <div class="bio">
            Heating &bull; Cooling &bull; Installation &bull; Repair<br>
            <span class="area">Kansas City Metro</span>
        </div>

        <div class="contact-links">
            <a href="tel:+19139635392" class="contact-link">
                <svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                <span>(913) 963-5392</span>
            </a>
            <a href="mailto:maldonadolarios1987@gmail.com" class="contact-link">
                <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                <span>maldonadolarios1987@gmail.com</span>
            </a>
        </div>

        <div class="social">
            <a href="https://facebook.com/juancarlos.maldonadolarios" target="_blank" rel="noopener" aria-label="Facebook">
                <svg viewBox="0 0 24 24"><path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.25h3.33l-.53 3.49h-2.8V24C19.61 23.1 24 18.1 24 12.07z"/></svg>
            </a>
        </div>

        <button class="save-btn" onclick="toggleQR()">
            <svg viewBox="0 0 24 24"><path d="M3 11h8V3H3v8zm2-6h4v4H5V5zm8-2v8h8V3h-8zm6 6h-4V5h4v4zM3 21h8v-8H3v8zm2-6h4v4H5v-4zm13-2h-2v3h-3v2h3v3h2v-3h3v-2h-3v-3zm-3 8v-2h-2v2h2zm4 0v-2h-2v2h2z"/></svg>
            Save My Contact
        </button>

        <div class="footer">Powered by <a href="https://www.sharkitectdigital.com" target="_blank" rel="noopener">Sharkitect</a></div>
    </div>

    <div class="qr-overlay" id="qrOverlay" onclick="toggleQR()">
        <div class="qr-modal" onclick="event.stopPropagation()">
            <h3>SCAN TO SAVE</h3>
            <p>Point your camera at the code</p>
            <div class="qr-frame">
                <img src="qr-code.png" alt="Scan to save Carlos Maldonado's contact">
            </div>
            <button class="qr-close" onclick="toggleQR()">Close</button>
        </div>
    </div>

    <script>
        function toggleQR() {
            document.getElementById('qrOverlay').classList.toggle('active');
        }
    </script>
</body>
</html>
